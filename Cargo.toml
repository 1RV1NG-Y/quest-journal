[workspace]
members = [
  "crates/quest-core",
  "crates/quest-storage",
  "crates/quest-adapters",
  "crates/quest-native-host",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev]
debug = "line-tables-only"
